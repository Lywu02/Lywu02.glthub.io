<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>云川</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background-color: #fafafa;
      color: #333;
      line-height: 1.8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .container {
      max-width: 520px;
      width: 100%;
      text-align: center;
    }

    /* 名字 */
    h1 {
      font-size: 2.4rem;
      font-weight: 300;
      letter-spacing: 0.15em;
      margin-bottom: 12px;
      color: #222;
    }

    /* 简介 */
    .bio {
      font-size: 1.15rem;
      color: #666;
      margin-bottom: 48px;
      font-weight: 300;
    }

    /* 分割线 */
    .divider {
      width: 40px;
      height: 1px;
      background-color: #ddd;
      margin: 0 auto 48px;
    }

    /* 经历区域 */
    .section {
      margin-bottom: 48px;
    }

    .section-title {
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      color: #999;
      text-transform: uppercase;
      margin-bottom: 16px;
      font-weight: 400;
    }

    .experience {
      font-size: 1.1rem;
      color: #444;
      font-weight: 300;
    }

    /* 页脚 */
    footer {
      margin-top: 60px;
      font-size: 0.8rem;
      color: #bbb;
      letter-spacing: 0.05em;
    }

    /* 响应式 */
    @media (max-width: 480px) {
      h1 {
        font-size: 2rem;
      }
      .bio {
        font-size: 1.05rem;
      }
    }

    /* 轻微淡入动画 */
    .fade-in {
      opacity: 0;
      transform: translateY(12px);
      animation: fadeIn 0.8s ease forwards;
    }

    .fade-in:nth-child(2) { animation-delay: 0.15s; }
    .fade-in:nth-child(3) { animation-delay: 0.3s; }
    .fade-in:nth-child(4) { animation-delay: 0.45s; }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="fade-in">云川</h1>
    <p class="bio fade-in">你开心就好</p >

    <div class="divider fade-in"></div>

    <div class="section fade-in">
      <div class="section-title">经历</div>
      <div class="experience">三恋</div>
    </div>

    <footer class="fade-in">
      © 云川
    </footer>
  </div>

  <script>
    // 简单的淡入效果已通过 CSS 实现
    // 如需更多交互，可在此扩展
  </script>
</body>
</html>
